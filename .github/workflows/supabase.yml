name: Deploy Supabase

# Pushes the database migrations and the edge function whenever anything under
# supabase/ changes, so GitHub stays the system of record for the backend the
# same way it already is for the page.
#
# Inert until three repository secrets exist:
#   SUPABASE_ACCESS_TOKEN   personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    the project ref, e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD    the database password chosen at project creation
#
# Without them the job reports "not configured" and exits cleanly, rather than
# failing every push.

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Check whether Supabase deployment is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets are not set; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.guard.outputs.configured == 'true'
        name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - if: steps.guard.outputs.configured == 'true'
        name: Apply migrations
        run: supabase db push

      - if: steps.guard.outputs.configured == 'true'
        name: Deploy the edge function
        run: supabase functions deploy invoke-agent
